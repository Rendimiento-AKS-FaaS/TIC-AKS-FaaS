apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-web-server-read
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-web-server-read
  template:
    metadata:
      labels:
        app: nginx-web-server-read
    spec:
      containers:
      - name: nginx-web-server-read
        image: imagesreadflow.azurecr.io/nginx-web-server-read:v1
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-web-server-read
spec:
  type: LoadBalancer
  selector:
    app: nginx-web-server-read
  ports:
  - port: 80
    targetPort: 8080