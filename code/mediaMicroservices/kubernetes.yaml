apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  labels:
    app: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
      - name: jaeger
        image: jaegertracing/all-in-one:latest
        ports:
        - containerPort: 16686
          name: query
        - containerPort: 6831
          protocol: UDP
          name: agent-udp
        - containerPort: 14268
          name: collector-http
        - containerPort: 4317
          name: collector-grpc
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
spec:
  selector:
    app: jaeger
  ports:
  - name: query
    port: 16686
    targetPort: 16686
  - name: agent-udp
    port: 6831
    protocol: UDP
    targetPort: 6831
  - name: collector-http
    port: 14268
    targetPort: 14268
  - name: collector-grpc
    port: 4317
    targetPort: 4317

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: page-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: page-service
  template:
    metadata:
      labels:
        app: page-service
    spec:
      containers:
      - name: page-service
        image: imagesreadflow.azurecr.io/media-microservices-read:v1
        command: ["PageService"]
        env:
        - name: SERVICE_CONFIG_FILE
          value: "/media-microservices/config/service-config.json"
        ports:
        - containerPort: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: page-service
spec:
  selector:
    app: page-service
  ports:
  - port: 9090
    targetPort: 9090

---

