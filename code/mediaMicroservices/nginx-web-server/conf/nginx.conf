# Load the OpenTracing dynamic module.
load_module modules/ngx_http_opentracing_module.so;

# Checklist: Make sure that worker_processes == #cores you gave to
# nginx process
worker_processes  4;

# error_log  logs/error.log;

# Checklist: Make sure that worker_connections * worker_processes
# is greater than the total connections between the client and Nginx. 
events {
  worker_connections  1024;
}



http {
  # Load a vendor tracer
  opentracing on;
  opentracing_load_tracer /usr/local/lib/libjaegertracing_plugin.so /usr/local/openresty/nginx/jaeger-config.json;

  include       mime.types;
  default_type  application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request"'
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';
  # access_log  logs/access.log  main;

  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;

  # Checklist: Make sure the keepalive_timeout is greateer than
  # the duration of your experiment and keepalive_requests
  # is greateer than the total number of requests sent from
  # the workload generator
  keepalive_timeout  120s;
  keepalive_requests 100000;

  # Kubernetes kube-dns resolver
  resolver kube-dns.kube-system.svc.cluster.local ipv6=off;

  lua_package_path '/usr/local/openresty/nginx/lua-scripts/?.lua;/gen-lua/?.lua;;';

  server {

    # Checklist: Set up the port that nginx listens to.
    listen       8080 reuseport;
    server_name  localhost;

    # Checklist: Turn of the access_log and error_log if you
    # don't need them.
    access_log  off;
    # error_log off;

    lua_need_request_body on;

    # Checklist: Make sure that the location here is consistent
    # with the location you specified in wrk2.
    location /wrk2-api/page/read {
      content_by_lua '
          local client = require "wrk2-api/page/read"
          client.ReadPage();
      ';
    }

    location /api/reading/page {
        content_by_lua_file /usr/local/openresty/nginx/lua-scripts/custom/page_read.lua;
    }

    location /api/reading/movie {
        content_by_lua_file /usr/local/openresty/nginx/lua-scripts/custom/movie_read.lua;
    }

    location /api/reading/review {
        content_by_lua_file /usr/local/openresty/nginx/lua-scripts/custom/review_read.lua;
    }

  }
}
